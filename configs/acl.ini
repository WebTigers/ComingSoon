; ComingSoon ACL — the holding page is PUBLIC (guest-readable, it is the site's public face while active);
; the skin admin is admin+.
[production]

acl.resources.comingsoon_index.resource = "Comingsoon_IndexController"
acl.rules.comingsoon_index.role         = "guest"
acl.rules.comingsoon_index.resource     = "Comingsoon_IndexController"
acl.rules.comingsoon_index.permission   = "allow"

acl.resources.comingsoon_admin.resource = "Comingsoon_AdminController"
acl.rules.comingsoon_admin.role         = "admin"
acl.rules.comingsoon_admin.resource     = "Comingsoon_AdminController"
acl.rules.comingsoon_admin.permission   = "allow"

[staging : production]
[testing : production]
[development : production]
